apiVersion: apps/v1
kind: Deployment
metadata:
  name: clients-depl
spec:
  replicas: 1
  selector:
    matchLabels:
      app: clients
  template:
    metadata:
      labels:
        app: clients
    spec:
      containers:
        - name: clients
          image: mugisha40/client-service:latest

# clutter ip
---
apiVersion: v1
kind: Service
metadata:
  name: clients-cluster-ip-serv
spec:
  selector:
    app: clients
  type: ClusterIP
  ports:
    - name: clients
      protocol: TCP
      port: 3000
      targetPort: 3000
